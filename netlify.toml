# Netlify — frontend only (Django stays local).
# IMPORTANT: In Netlify UI → Build settings → Publish directory = leave EMPTY
# or set to ".next". Do NOT set it to "frontend" (same as base).

[build]
  base = "frontend"
  command = "npm run build"
  # Relative to base directory. Must NOT equal the base folder itself.
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # Current tunnel host. Same value as frontend/.env.production. See docs/DEMO_READINESS.md.
  # This is a Cloudflare quick tunnel, not localtunnel. The name dies when cloudflared stops.
  # Do not replace it with a guessed hostname.
  NEXT_PUBLIC_API_ORIGIN = "https://inbox-sbjct-dominant-dating.trycloudflare.com"
  DJANGO_ORIGIN = "https://inbox-sbjct-dominant-dating.trycloudflare.com"

# Allow WebXR / camera for immersive AR on Android Chrome.
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "xr-spatial-tracking=*, camera=*, microphone=()"
    Feature-Policy = "xr-spatial-tracking *; camera *"

