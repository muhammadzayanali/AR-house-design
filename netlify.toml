# Netlify — frontend only (Django stays local).
# IMPORTANT: In Netlify UI → Build settings → Publish directory = leave EMPTY
# or set to ".next". Do NOT set it to "frontend" (same as base).

[build]
  base = "frontend"
  command = "npm run build"
  # Relative to base directory. Must NOT equal the base folder itself.
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # Server-side rewrite target (browser stays same-origin /api → no loca.lt CORS/511).
  # Keep tunnel alive: npx -y localtunnel --port 8000
  # Leave NEXT_PUBLIC_API_ORIGIN unset so the phone never talks to *.loca.lt directly.
  DJANGO_ORIGIN = "https://floppy-towns-invite.loca.lt"
